<svg width="130" height="130" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003300"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer pulsing ring -->
  <circle cx="65" cy="65" r="62" fill="url(#bg)" stroke="#00ff41" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="62;63;62" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Middle ring -->
  <circle cx="65" cy="65" r="50" fill="none" stroke="#00cc33" stroke-width="2" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0 314;314 0;0 314" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Rotating outer tick ring -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 65 65" to="360 65 65" dur="6s" repeatCount="indefinite"/>
    <line x1="65" y1="5"  x2="65" y2="18" stroke="#00ff41" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="5"  x2="65" y2="18" stroke="#00ff41" stroke-width="3" stroke-linecap="round" transform="rotate(60 65 65)"/>
    <line x1="65" y1="5"  x2="65" y2="18" stroke="#00ff41" stroke-width="3" stroke-linecap="round" transform="rotate(120 65 65)"/>
    <line x1="65" y1="5"  x2="65" y2="18" stroke="#00ff41" stroke-width="3" stroke-linecap="round" transform="rotate(180 65 65)"/>
    <line x1="65" y1="5"  x2="65" y2="18" stroke="#00ff41" stroke-width="3" stroke-linecap="round" transform="rotate(240 65 65)"/>
    <line x1="65" y1="5"  x2="65" y2="18" stroke="#00ff41" stroke-width="3" stroke-linecap="round" transform="rotate(300 65 65)"/>
  </g>

  <!-- Ben 10 hourglass symbol — counter-rotating -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 65 65" to="-360 65 65" dur="8s" repeatCount="indefinite"/>
    <polygon points="65,22 88,65 65,108 42,65" fill="#000000" stroke="#00ff41" stroke-width="2.5"/>
  </g>

  <!-- Center glowing circle -->
  <circle cx="65" cy="65" r="14" fill="#00ff41" filter="url(#glow)">
    <animate attributeName="fill" values="#00ff41;#39ff14;#00cc33;#00ff41" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="14;16;14" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center dot -->
  <circle cx="65" cy="65" r="5" fill="#000000"/>
</svg>
