<svg width="600" height="30" viewBox="0 0 600 30" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px; fill: #00FF41; text-anchor: middle; dominant-baseline: middle; opacity: 0; filter: drop-shadow(0 0 4px #00FF41);}
    .t1 { animation: cycle 12s infinite 0s; }
    .t2 { animation: cycle 12s infinite 3s; }
    .t3 { animation: cycle 12s infinite 6s; }
    .t4 { animation: cycle 12s infinite 9s; }
    @keyframes cycle {
      0%, 20% { opacity: 1; }
      25%, 100% { opacity: 0; }
    }
  </style>
  <text x="300" y="15" class="text t1">[ SCANNING... ] Alien Form Selected: DATA ANALYST 📊</text>
  <text x="300" y="15" class="text t2">[ SCANNING... ] Alien Form Selected: ML ENGINEER 🧠</text>
  <text x="300" y="15" class="text t3">[ SCANNING... ] Alien Form Selected: AI / ML ENGINEER 🤖</text>
  <text x="300" y="15" class="text t4">[ TRANSFORMING... ] Hero Mode Activated! It's Hero Time! 🦸‍♂️</text>
</svg>